/**:
  ros__parameters:
    # Linux I2C bus number  (/dev/i2c-N)
    i2c_bus: 1

    # MPU6500 I2C address: 0x68 (AD0 low) or 0x69 (AD0 high)
    i2c_address: 0x68

    # TF frame attached to the IMU
    frame_id: "imu_link"

    # Output rate in Hz (max reliable: ~500 Hz over software I2C, ~1000 Hz hardware)
    publish_rate: 200.0

    # Accelerometer full-scale range:
    #   0 = ±2 g   1 = ±4 g   2 = ±8 g   3 = ±16 g
    accel_range: 0

    # Gyroscope full-scale range:
    #   0 = ±250 dps  1 = ±500 dps  2 = ±1000 dps  3 = ±2000 dps
    gyro_range: 0

    # Digital Low-Pass Filter bandwidth (0–7, see MPU6500 datasheet Table 2)
    # 0=256Hz  1=188Hz  2=98Hz  3=42Hz  4=20Hz  5=10Hz  6=5Hz
    dlpf_bandwidth: 2

    # Run startup bias calibration (keep sensor stationary during boot)
    calibrate: true

    # Number of samples to average during calibration
    calib_samples: 500