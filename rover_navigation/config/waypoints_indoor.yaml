# indoor_room.world waypoints
# Room barriers: X ±~6.8m (east/west), Y ±~7.5m (north/south)
# Ground slab:   10.0 x 15.0m centred at origin
# Waypoints stay 1.5m inside barriers for clearance
# Yaw: 0 = facing +X, 90 = facing +Y, -90 = facing -Y, 180 = facing -X

waypoints:
  - name: "wp_1"
    x: -3.5
    y: -5.5
    yaw: 0.0       # SW corner, facing east

  - name: "wp_2"
    x: 3.5
    y: -5.5
    yaw: 90.0      # SE corner, facing north

  - name: "wp_3"
    x: 3.5
    y: 5.5
    yaw: 180.0     # NE corner, facing west

  - name: "wp_4"
    x: -3.5
    y: 5.5
    yaw: -90.0     # NW corner, facing south

on_completion: "loop"