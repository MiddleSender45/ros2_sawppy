# rover_motion – IMU node parameters
# Override values here or pass them on the command line via the launch file.

imu_node:
  ros__parameters:
    # I²C bus device path
    i2c_bus: "/dev/i2c-1"

    # I²C address of MPU-9250 (decimal); 104 = 0x68, 105 = 0x69
    i2c_addr: 104

    # tf2 frame attached to the sensor
    frame_id: "imu_link"

    # Publish rate in Hz (max ≈ 1000 Hz hardware, keep ≤ 200 in practice)
    frequency: 50.0

    # Also publish sensor_msgs/Temperature on /imu/temp
    publish_temp: true
